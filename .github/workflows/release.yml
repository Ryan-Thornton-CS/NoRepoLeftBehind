name: Draft release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - name: Verify release version
        run: uv run python scripts/check_release.py "$GITHUB_REF_NAME"
      - run: uv build
      - name: Verify and assemble complete-source release packages
        run: uv run python scripts/package_release.py
      - name: Smoke-test wheel
        run: |
          uv venv /tmp/bridge-release
          uv pip install --python /tmp/bridge-release/bin/python dist/*.whl
          /tmp/bridge-release/bin/norepoleftbehind diagnostics
          uv run python scripts/smoke_install.py /tmp/bridge-release/bin/norepoleftbehind
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/release/"$GITHUB_REF_NAME"/*
          --draft --verify-tag --generate-notes --title "NoRepoLeftBehind $GITHUB_REF_NAME"
