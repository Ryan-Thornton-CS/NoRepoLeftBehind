name: Draft release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --dev
      - name: Verify release version
        run: uv run python scripts/check_release.py "$GITHUB_REF_NAME"
      - run: uv build
      - name: Smoke-test wheel
        run: |
          uv venv /tmp/bridge-release
          uv pip install --python /tmp/bridge-release/bin/python dist/*.whl
          /tmp/bridge-release/bin/llm-tool-bridge diagnostics
          uv run python scripts/smoke_install.py /tmp/bridge-release/bin/llm-tool-bridge
      - name: Prepare assets
        run: |
          cp README.md examples/bridge.yaml dist/
          cd dist
          sha256sum *.whl *.tar.gz README.md bridge.yaml > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --generate-notes
