[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "norepoleftbehind"
version = "0.1.0"
description = "NoRepoLeftBehind: configurable OpenAI-compatible tool translation middleware"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "openai>=2,<3",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
norepoleftbehind = "norepoleftbehind.cli:main"

[project.urls]
Repository = "https://github.com/Ryan-Thornton-CS/NoRepoLeftBehind"
Issues = "https://github.com/Ryan-Thornton-CS/NoRepoLeftBehind/issues"

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1",
  "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6,<7",
  "types-jsonschema>=4,<5", "build>=1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/norepoleftbehind"]

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "examples", "scripts", "docs", ".github", ".gitignore",
  "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "LICENSE", "pyproject.toml", "uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D100", "D101", "D102", "D103", "D104", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
