# Credentials and exact model IDs come from the harness. No secrets belong here.
upstream_base_url: https://gateway.example.invalid/v1
host: 127.0.0.1
port: 8787
history_mode: flatten
instructions: inject
tools_mode: prompt_and_translate
prompt_template: auto

limits:
  max_concurrency: 8
  request_timeout_seconds: 180
  connect_timeout_seconds: 10
  max_request_bytes: 16777216
  max_prompt_bytes: 8388608
  max_response_bytes: 8388608
  max_output_tokens: 16384
  # Optional estimate-based preflight, not an exact provider tokenizer:
  estimated_input_token_limit: null
  estimated_bytes_per_token: 3
  token_safety_margin: 1.2

parsing:
  tolerance: broad
  correction_attempts: 2
  max_tool_calls: 32
  # Supply schema-valid arguments here for complex schemas whose examples cannot
  # be synthesized (e.g. regex-constrained identifiers).
  example_arguments: {}

cloud_context:
  enabled: false
  # This mapping is a preset, not a claim that Chat Completions supports it.
  # Verify your gateway's behavior before enabling.
  contract_verified: false
  preset: google_interactions
  response_id_pointer: /id
  response_id_header: null
  request_id_pointer: /previous_interaction_id
  session_id_header: X-LLM-Bridge-Session-ID
  session_id_body_pointer: null
  idle_ttl_seconds: 1800
  max_sessions: 128
  max_history_bytes: 8388608

diagnostics:
  content_traces: false
  trace_directory: traces
  trace_max_bytes: 1048576
  trace_backup_count: 2
  trace_record_bytes: 65536

profiles:
  preserves_messages:
    history_mode: messages
  native_passthrough:
    history_mode: messages
    instructions: preserve
    tools_mode: preserve
